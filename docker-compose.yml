version: '3.7'
services:
  postgres:
    image: postgres:12
    restart: unless-stopped
    environment:
      POSTGRES_DB: plezanjenet
      POSTGRES_USER: plezanjenet
      POSTGRES_PASSWORD: plezanjenet
    ports:
      - "5432:5432"
    volumes:
      - ./db:/etc/db
  redis: 
    image: redis:6
    restart: unless-stopped
    ports:
      - "6379:6379"